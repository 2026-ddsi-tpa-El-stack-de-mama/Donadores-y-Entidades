spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:testdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=${PORT:8080}

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

spring.devtools.restart.enabled=true


# Metrics
management.datadog.metrics.export.enabled=true
management.datadog.metrics.export.api-key=9122b5e1aacf1043ea3e0761bdea7f41
management.datadog.metrics.export.step=30s
management.datadog.metrics.export.uri=https://api.us5.datadoghq.com